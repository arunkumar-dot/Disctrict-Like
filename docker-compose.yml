services:
  db:
    image: postgres:17
    container_name: districtlike-db
    environment:
      POSTGRES_USER: districtlike
      POSTGRES_PASSWORD: districtlike
      POSTGRES_DB: districtlike
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U districtlike"]
      interval: 5s
      retries: 5
volumes:
  pgdata: